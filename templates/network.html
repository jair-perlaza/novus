<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #010204; color: #00f2ff; font-family: monospace; overflow: hidden; height: 100vh; }

        .novus-container { display: flex; flex-direction: column; height: 100vh; padding: 20px; gap: 20px; }

        /* Solo la cabecera técnica */
        .tech-header { height: 40px; border-bottom: 1px solid #00f2ff33; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }

        /* Área del Radar: Sin interferencias */
        .radar-zone { flex: 1; border: 1px solid #00f2ff22; background: #000; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 8px; }

        /* Área de Logs: Única info adicional */
        .log-zone { height: 250px; background: rgba(5, 15, 30, 0.95); border: 1px solid #00f2ff22; padding: 15px; border-radius: 8px; overflow-y: auto; }

        .log-entry { font-size: 11px; color: #39ff14; margin-bottom: 6px; border-left: 2px solid #39ff14; padding-left: 8px; }
        .threat-alert { color: #ff3131; font-weight: bold; }
    </style>
</head>
<body>

<div class="novus-container">
    <div class="tech-header">
        <div>NOVUS | NETWORK_MONITOR</div>
        <div>GATEWAY_IP: <span style="color:#39ff14">Detectando...</span></div>
    </div>

    <div class="radar-zone">
        <canvas id="novusRadar" width="500" height="500"></canvas>
        <div style="position:absolute; bottom:20px; font-size:10px; opacity:0.5;">ESCANEANDO RED LOCAL</div>
    </div>

    <div class="log-zone">
        <h3 style="font-size:12px; margin-bottom:10px; color:#00f2ff;">REGISTRO DE EVENTOS EN TIEMPO REAL</h3>
        <div id="realtime-logs">
            <div class="log-entry">Esperando datos reales del escaneo de red...</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('novusRadar');
    const ctx = canvas.getContext('2d');
    let angle = 0;
    let dispositivosReales = [];

    // Cargar datos reales del backend
    async function cargarDatosReales() {
        try {
            const response = await fetch('/api/network/nodes');
            const data = await response.json();
            dispositivosReales = data.nodes || [];
            
            // Actualizar gateway
            document.querySelector('.tech-header span').textContent = 
                dispositivosReales.length > 0 ? 'Detectado' : 'Buscando...';
            
            // Actualizar logs con datos reales
            actualizarLogsReales();
            
        } catch (error) {
            console.error('Error cargando datos reales:', error);
        }
    }

    function actualizarLogsReales() {
        const logsContainer = document.getElementById('realtime-logs');
        if (!logsContainer) return;
        
        let logs = [];
        
        // Logs de dispositivos reales detectados
        dispositivosReales.forEach(dispositivo => {
            logs.push(`<div class="log-entry">[${new Date().toLocaleTimeString()}] Dispositivo detectado: ${dispositivo.ip} (${dispositivo.name})</div>`);
        });
        
        if (logs.length === 0) {
            logs.push('<div class="log-entry">Esperando dispositivos en la red...</div>');
        }
        
        logsContainer.innerHTML = logs.join('');
    }

    function drawRadar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r = canvas.height / 2.2;

        // Círculos de fondo
        ctx.strokeStyle = '#00f2ff11';
        for(let i=1; i<=4; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy, r * i / 4, 0, 2 * Math.PI);
            ctx.stroke();
        }

        // Líneas radiales
        for(let i=0; i<8; i++) {
            const a = i * Math.PI / 4;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
            ctx.stroke();
        }

        // Dibujar dispositivos reales
        dispositivosReales.forEach((dispositivo, index) => {
            const angle = (index / dispositivosReales.length) * 2 * Math.PI;
            const x = cx + (r * 0.7) * Math.cos(angle);
            const y = cy + (r * 0.7) * Math.sin(angle);
            
            ctx.fillStyle = '#39ff14';
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.fillStyle = '#00f2ff';
            ctx.font = '10px monospace';
            ctx.fillText(dispositivo.ip, x + 10, y);
        });

        // Escaneo animado
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
        ctx.stroke();

        angle += 0.02;
        requestAnimationFrame(drawRadar);
    }

    // Iniciar carga de datos y radar
    cargarDatosReales();
    setInterval(cargarDatosReales, 5000); // Actualizar cada 5 segundos
    drawRadar();
</script>
</body>
</html>
